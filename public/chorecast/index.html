async function initStore() {
  let db = null, assets = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, assets] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('assets').catch(() => null)]);
    }
  } catch (e) { db = null; }
  Store.assets = assets;
  if (!db) {
    // On the Chorecast website a signed-in family syncs through the server; anywhere else data stays on this device.
    const acct = await probeServer();
    if (acct && acct.me) return startServerMode(acct.me);
    Store.mode = 'local'; loadLocal();
    if (acct && acct.signedOut && !lsGet('cc:localOnly', false)) UI.needSignIn = true;
    Acct.available = !!acct;
    return;
  }
  Store.mode = 'cloud'; Store.db = db;
  await new Promise(resolve => {
    let left = 6, done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    const first = fn => { let fired = false; return arg => { fn(arg); Store.ver++; scheduleRender(); if (!fired) { fired = true; if (--left === 0) finish(); } }; };
    const onErr = e => { console.warn('sync stopped', e); if (e && e.code !== 'revoked') toast('Live sync paused. Reload to reconnect.'); finish(); };
    db.doc('family/settings').onSnapshot(first(s => { Store.settings = s.exists ? { ...s.data() } : null; }), onErr);
    for (const col of ['kids', 'jobs', 'habits', 'growth', 'guides']) {
      let q = db.collection(col);
      if (col === 'jobs') q = q.orderBy('at', 'desc').limit(800);
      q.onSnapshot(first(qs => { const m = {}; qs.docs.forEach(d => { m[d.id] = { ...d.data(), id: d.id }; }); Store[col] = m; }), onErr);
    }
    setTimeout(finish, 9000);
  });
}

/* ---------- Family account: email sign-in and live sync through the Chorecast server ----------

   the server, which pushes it to the family's other devices over an event stream. Offline writes wait in an outbox,
   and the last snapshot is kept on the device so the app still opens without a connection. */

function applySnapshot(d) { Store.settings = d.settings || null; Store.kids = d.kids || {}; Store.jobs = d.jobs || {}; Store.habits = d.habits || {}; Store.growth = d.growth || {}; Store.guides = d.guides || {}; }

function openStream() {

const FX = (() => {
  const cv = $('#fx'), g = cv.getContext('2d'); let W = 0, H = 0, parts = [], raf = 0;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener('resize', size); size();

    g.clearRect(0, 0, W, H); parts = parts.filter(p => p.life > 0 && p.y < H + 40);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.008;
      g.save(); g.globalAlpha = clamp(p.life * 1.5, 0, 1); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;

    rain(colors = CONF) { const n = reduced ? 20 : 130; for (let i = 0; i < n; i++) parts.push(mk(Math.random() * W, -20 - Math.random() * H * 0.5, (Math.random() - 0.5) * 2, 2 + Math.random() * 3, 0.05, colors[i % colors.length], 1.7)); kick(); },

function PaneFX(canvas, th) {

        g.fillStyle = '#fff'; g.beginPath(); g.arc(p.x - p.s * 0.16, p.y - p.s * 0.16, p.s * 0.08, 0, 6.283); g.fill();
      } else if (type === 'star' || type === 'sparkle') {
        p.y += (type === 'star' ? 10 : -14) * p.v * dt; if (p.y > H + 30 || p.y < -30) { parts[i] = spawn(false); parts[i].y = type === 'star' ? -20 : H + 20; }

        if ((p.t * 26 * p.v) % 130 < 1) { p.x = Math.random() * W; p.y = Math.random() * H; }
      } else if (type === 'paw') {
        const al = Math.sin(p.t * 0.7 + p.a); if (al < -0.95) { p.x = Math.random() * W; p.y = Math.random() * H; }
        g.globalAlpha = Math.max(0, al) * p.o; g.fillStyle = '#fff'; const s = p.s * 0.5;
        g.beginPath(); g.ellipse(p.x, p.y, s * 0.55, s * 0.45, 0, 0, 6.283); g.fill();
        [[-0.6, -0.75], [-0.2, -1.05], [0.2, -1.05], [0.6, -0.75]].forEach(([dx, dy]) => { g.beginPath(); g.arc(p.x + dx * s, p.y + dy * s, s * 0.2, 0, 6.283); g.fill(); });
      } else if (type === 'streak') {
        p.x += p.v * 520 * dt; if (p.x > W + 160) { p.x = -200; p.y = Math.random() * H; }
        g.globalAlpha = p.o; g.strokeStyle = '#fff'; g.lineWidth = 2 + p.v * 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.s * 4, p.y); g.stroke();

/* Sky */
function initSky() {
  const r = mulberry(7); let h = '<div class="stars">';
  for (let i = 0; i < 70; i++) h += `<i style="left:${(r() * 100).toFixed(1)}%;top:${(r() * 72).toFixed(1)}%;--s:${(1 + r() * 2.2).toFixed(1)}px;--d:-${(r() * 4).toFixed(1)}s"></i>`;
  h += '</div><div class="sun"></div><div class="moon"></div>';
  for (let i = 0; i < 7; i++) h += `<div class="cloud" style="--w:${(150 + r() * 280) | 0}px;--y:${(3 + r() * 58).toFixed(1)}%;--dur:${(80 + r() * 90) | 0}s;--delay:-${(r() * 160) | 0}s;--x:${(r() * 90) | 0}vw"></div>`;
  $('#sky').innerHTML = h + '<div class="haze"></div>';
}
function phaseNow() { const h = new Date().getHours(); return h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'dusk' : 'night'; }

  const ph = phaseNow(), wx = wxNow(), P = SKY[ph].map((c, i) => mixHex(c, SKY_GREY[ph][i], wx.grey)), root = document.documentElement.style;
  if (G3.weather) G3.weather(wx);

  const sky = $('#sky'); sky.dataset.phase = ph;
  let x, y, cloud;
  if (UI.skyProgress == null) { const d = new Date(); const p = clamp((d.getHours() + d.getMinutes() / 60 - 6) / 14, 0, 1); x = 10 + p * 80; y = 74 - Math.sin(Math.PI * p) * 56; cloud = 0.5; }
  else { const p = clamp(UI.skyProgress, 0, 1); x = innerWidth >= 1000 ? 56 + p * 22 : 70 + p * 12; y = 80 - Math.sin(p * Math.PI / 2) * 66; cloud = 0.62 - p * 0.52; }
