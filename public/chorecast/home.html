<script>
// First open in this browser (no saved homes yet): start from the saved working copy (home/seed-save.json), so the
// homes, pets and progress carry on where they were on 9 Nov 2026.
(function () { try { if (Object.keys(localStorage).some(k => k.indexOf('cc:home:') === 0)) return; const x = new XMLHttpRequest(); x.open('GET', 'home/seed-save.json', false); x.send(); if (x.status !== 200) return; const o = JSON.parse(x.responseText); for (const k in o) localStorage.setItem(k, o[k]); } catch (e) { /* starts fresh */ } })();
</script>
